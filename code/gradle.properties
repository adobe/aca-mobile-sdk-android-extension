# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin
kotlin.code.style=official

# AEP SDK versions (for AEPSDK Commons)
# Using 3.+ to get latest compatible versions with ExtensionDiscoveryService support
mavenCoreVersion=3.+
mavenEdgeVersion=3.+
mavenEdgeIdentityVersion=3.+

# Module information
moduleName=contentanalytics
moduleVersion=3.0.0
mavenRepoName=contentanalytics
mavenRepoDescription=Content Analytics extension for Adobe Experience Platform Mobile SDK

# Java 17 is required (matches aepsdk-commons and other AEP Android extensions).
# Option 1: Set JAVA_HOME to JDK 17 before running Gradle.
# Option 2: Uncomment and set below (use your JDK 17 path; e.g. Homebrew: /opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home)
# org.gradle.java.home=/path/to/jdk17
